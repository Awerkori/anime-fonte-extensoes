name: Sync Upstream (Yuzono)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar execução completa mesmo sem novas alterações'
        required: false
        type: boolean
        default: false
      trigger_source:
        description: 'Origem do disparo (heartbeat, watchdog, manual)'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - heartbeat
          - watchdog
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sync-upstream-yuzono
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync Yuzono upstream (Nox-wins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.BOT_PAT }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}
          persist-credentials: true

      - name: Watchdog guard & mode detection
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || 'manual' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/pulse_guard.py watchdog-check

      - name: Check for upstream updates
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true'
        id: check_upstream
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin
          git fetch https://github.com/yuzono/anime-extensions.git master:refs/remotes/upstream/master

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Forced sync via input. Proceeding with sync."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python .github/scripts/check-consistency.py --check-pending
          CONSISTENCY_EXIT=$?
          set -e

          if [ "$CONSISTENCY_EXIT" -eq 2 ]; then
            echo "Pending upstream updates or divergences detected. Proceeding with sync."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "All extensions are in sync with upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true' && steps.check_upstream.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test upstream deletion handling
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true' && steps.check_upstream.outputs.has_changes == 'true'
        run: python .github/scripts/test_sync_upstream_deletions.py

      - name: Sync upstream (Nox-wins)
        if: steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true' && steps.check_upstream.outputs.has_changes == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Sync upstream — Tentativa $attempt de $MAX_ATTEMPTS"
            if python .github/scripts/sync-upstream.py --push; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting 10s before retry..."
              sleep 10
              git fetch origin
            else
              echo "::error::Sync upstream failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
          done

      - name: Trigger next check (24/7 cloud pulse)
        if: always() && !cancelled() && steps.guard.conclusion == 'success' && steps.guard.outputs.should_run_sync == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || 'manual' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/pulse_guard.py pulse-dispatch --sleep-seconds 300
