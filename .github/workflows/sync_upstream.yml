name: Sync Upstream (Yuzono)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"  # 20:00 BRT diariamente

permissions: {}

jobs:
  sync:
    name: Sync Yuzono upstream (Nox-wins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream (Nox-wins)
        run: python .github/scripts/sync-upstream.py --push
