name: Sync Upstream (Yuzono)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar execução completa mesmo sem novas alterações'
        required: false
        type: boolean
        default: false
      heartbeat:
        description: 'Continuar pulse remoto 24/7'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

concurrency:
  group: sync-upstream-yuzono
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync Yuzono upstream (Nox-wins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}
          persist-credentials: true

      - name: Check for upstream updates
        id: check_upstream
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          UPSTREAM_URL="https://github.com/yuzono/anime-extensions.git"
          UPSTREAM_SHA=$(git ls-remote "$UPSTREAM_URL" refs/heads/master | awk '{print $1}')
          SYNC_SHA=$(git ls-remote origin refs/heads/sync | awk '{print $1}')

          echo "Upstream master HEAD: ${UPSTREAM_SHA}"
          echo "Last Synced SHA:     ${SYNC_SHA}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::warning::Failed to query upstream HEAD SHA. Proceeding with sync to ensure no missed updates."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Forced sync via input. Proceeding with sync."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the upstream commit matches the synced marker, no new upstream changes exist
          if [ "$UPSTREAM_SHA" = "$SYNC_SHA" ]; then
            LOCAL_HEAD=$(git rev-parse HEAD)
            echo "=================================================="
            echo "PROJECT NOX — UPSTREAM SYNC"
            echo "=================================================="
            echo "SYNC_PROJECT=anime"
            echo "SYNC_TRIGGER=${{ github.event_name }}"
            echo "LOCAL_HEAD=${LOCAL_HEAD}"
            echo "UPSTREAM_REMOTE=${UPSTREAM_URL}"
            echo "UPSTREAM_BRANCH=master"
            echo "UPSTREAM_HEAD=${UPSTREAM_SHA}"
            echo "LAST_SYNCED_UPSTREAM=${SYNC_SHA}"
            echo "NEW_COUNT=0"
            echo "UPDATED_COUNT=0"
            echo "REMOVED_COUNT=0"
            echo "CORE_CHANGED=false"
            echo "MULTISRC_CHANGED=false"
            echo "NO_CHANGES=true"
            echo "=================================================="
            echo "No new updates in upstream. Upstream ${UPSTREAM_SHA} is already synchronized."
            echo "=================================================="
            echo "SYNC_RESULT=NO_CHANGES"
            echo "PUSH_RESULT=SKIPPED"
            echo "PUBLICATION_RESULT=SKIPPED"
            echo "=================================================="
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream changes detected (${UPSTREAM_SHA} != ${SYNC_SHA} or not in main). Proceeding with sync."
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.check_upstream.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test upstream deletion handling
        if: steps.check_upstream.outputs.has_changes == 'true'
        run: python .github/scripts/test_sync_upstream_deletions.py

      - name: Sync upstream (Nox-wins)
        if: steps.check_upstream.outputs.has_changes == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/sync-upstream.py --push

      - name: Trigger next check (24/7 cloud pulse)
        if: always() && !cancelled() && (github.event.inputs.heartbeat != 'false')
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          echo "Waiting 5 minutes before scheduling next remote check..."
          sleep 300
          gh workflow run sync_upstream.yml --ref main -R ${{ github.repository }} || true
